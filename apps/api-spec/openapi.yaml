openapi: 3.1.0
info:
  title: Labmate Control Plane API
  version: 0.1.0
  description: >
    The Labmate control plane is the Cloudflare Worker (apps/web) that the MCP
    server and the cockpit both talk to. It is the single contract for parallel
    front-end / back-end work: the back end implements these routes against D1,
    R2, and the Durable Object; the front end builds the cockpit against a mock
    generated from this file. Neither side has to wait for the other.

    Conventions
    -----------
    * All write routes mirror a semantic MCP tool (create_study, profile_dataset,
      propose_experiments, request_approval, launch_experiment, query_runs,
      record_human_feedback, write_report, grade_study_against_rubric).
    * Writes require the shared internal bearer token (LABMATE_INTERNAL_TOKEN).
      Reads used by the cockpit are public.
    * Entity shapes mirror packages/schemas/*.schema.json and apps/web/schema.sql.
      If you change an entity, change it there and here together.
    * The evidence ledger is the product: every run links to a hypothesis and
      carries rationale; every critique and decision is recorded.

servers:
  - url: http://localhost:8787
    description: Local wrangler dev
  - url: https://labmate.{your-subdomain}.workers.dev
    description: Deployed Worker (this becomes LABMATE_PUBLIC_URL)
    variables:
      your-subdomain:
        default: example

tags:
  - name: studies
    description: Create studies and read the full evidence ledger.
  - name: experiments
    description: Propose hypotheses and launch sandboxed runs.
  - name: approvals
    description: Human approval gates for compute and risky actions.
  - name: feedback
    description: Human business judgment, parsed into experiment constraints.
  - name: reports
    description: Reproducible model cards with provenance.
  - name: grading
    description: Machine-gradable definition of done.

security:
  - internalToken: []

paths:
  /api/studies:
    post:
      tags: [studies]
      operationId: createStudy
      summary: Create a study (create_study)
      description: >
        Opens the evidence ledger from a brief. The human supplies business
        judgment (objective, target, metric, constraints, budget); this returns
        the study id everything else hangs off.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudyRequest"
            examples:
              slaTickets:
                $ref: "#/components/examples/CreateStudySlaTickets"
      responses:
        "201":
          description: Study created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateStudyResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [studies]
      operationId: listStudies
      summary: List studies (cockpit home)
      description: Read route the cockpit uses to render the study list. Public.
      security: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, running, done, stopped]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: A list of studies.
          content:
            application/json:
              schema:
                type: object
                required: [studies]
                properties:
                  studies:
                    type: array
                    items: { $ref: "#/components/schemas/Study" }

  /api/studies/{studyId}:
    parameters:
      - $ref: "#/components/parameters/StudyId"
    get:
      tags: [studies]
      operationId: getStudy
      summary: Full study detail / evidence ledger (study detail)
      description: >
        The cockpit's main read and the shape grade_study.py fetches. Returns the
        study plus its dataset version, hypotheses, runs, critiques, decisions,
        feedback, and artifacts — the whole ledger in one call. Public.
      security: []
      responses:
        "200":
          description: The study and its complete ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyDetail"
        "404": { $ref: "#/components/responses/NotFound" }

  /api/studies/{studyId}/stream:
    parameters:
      - $ref: "#/components/parameters/StudyId"
    get:
      tags: [studies]
      operationId: streamStudy
      summary: Live agent activity for a study (Server-Sent Events)
      description: >
        The control plane proxies the agent runtime's Managed Agents event stream
        through to the cockpit: agent narration, tool-use, tool-results, nudges,
        approval requests, and a final done event. Public, like the other reads.
        Each SSE `data:` line is a JSON object with a `kind` discriminator
        (e.g. session.created, agent.activity, tool.use, tool.result, nudge,
        approval.needed, study.done, loop.error). Subscribing also starts the
        study's session if it has not started yet.
      security: []
      responses:
        "200":
          description: An event stream of live agent activity.
          content:
            text/event-stream:
              schema:
                type: string

  /api/studies/{studyId}/message:
    parameters:
      - $ref: "#/components/parameters/StudyId"
    post:
      tags: [studies]
      operationId: suggestChange
      summary: Inject a human "suggest changes" message into the live session
      description: >
        Steering for a live study. The control plane proxies the text to the agent
        runtime, which injects it as a user.message into the running Managed Agents
        session so it affects the next step (not just a ledger note). The cockpit
        also records the same text via /api/feedback for the evidence ledger.
        Returns 503 { error: "runtime_unavailable" } when no runtime is wired.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: The human's natural-language steering message.
      responses:
        "202":
          description: Message queued for injection into the session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The session is not ready yet (no live session to inject into).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The agent runtime is not configured or unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/profile:
    post:
      tags: [studies]
      operationId: profileDataset
      summary: Profile the dataset (profile_dataset)
      description: >
        Profiles the study's dataset and writes a dataset version: columns with
        dtypes and missingness, candidate leakage columns (flagged, defaulting to
        banned), the split strategy, and the seed.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [study_id]
              properties:
                study_id: { type: string }
      responses:
        "200":
          description: Dataset profiled; data contract written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersion"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/datasets:
    post:
      tags: [studies]
      operationId: uploadDataset
      summary: Upload + profile a dataset CSV (upload_dataset)
      description: >
        Token-gated write. Accepts a raw `text/csv` body (with optional
        `?dataset_id=` and `?target=` query params) OR a JSON body
        `{ dataset_id?, csv, target? }`. Stores the CSV in R2 at
        `datasets/{dataset_id}.csv`, upserts a row in the `dataset` catalog
        (content hash, row count, cached profile), and returns
        `{ dataset_id, profile }` where `profile` is the REAL profiling result
        produced by `profileCsv` (per-column dtype, missingness, cardinality,
        example values, leakage flags, a suggested split, and suggested
        categoricals/datetime columns). Idempotent on a given `dataset_id`
        (re-upload overwrites the R2 object and updates the catalog row). The
        `target` is optional — name-pattern leakage detection always runs;
        supplying it additionally enables the near-perfect-separation heuristic.
      security:
        - internalToken: []
      parameters:
        - name: dataset_id
          in: query
          required: false
          schema: { type: string }
          description: >
            Optional R2-safe id for the dataset (sanitized server-side to
            `[A-Za-z0-9._-]`). The server assigns `dataset_<ulid>` when omitted.
            A `dataset_id` in the JSON body takes precedence over this query param.
        - name: target
          in: query
          required: false
          schema: { type: string }
          description: >
            Optional target column name, used to drive the leakage-by-separation
            heuristic. The JSON body's `target` overrides this when present.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              description: The raw CSV text (header row + data rows).
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv:
                  type: string
                  description: The raw CSV text (header row + data rows).
                dataset_id:
                  type: string
                  description: Optional R2-safe id; the server assigns one when omitted.
                target:
                  type: string
                  description: Optional target column for separation-based leakage scoring.
      responses:
        "201":
          description: Dataset stored and profiled.
          content:
            application/json:
              schema:
                type: object
                required: [dataset_id, profile]
                properties:
                  dataset_id: { type: string }
                  profile: { $ref: "#/components/schemas/DatasetProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/experiments/propose:
    post:
      tags: [experiments]
      operationId: proposeExperiments
      summary: Propose hypothesis cards (propose_experiments)
      description: >
        Returns N hypothesis cards (statement, rationale, model family, candidate
        features, expected outcome). These render as the experiment cards in the
        cockpit; the human approves, edits, or rejects them.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [study_id]
              properties:
                study_id: { type: string }
                hypotheses:
                  type: array
                  description: >
                    Agent-authored hypothesis cards to persist (the agent reasons in
                    hypotheses; the human approves them). When present these are
                    persisted and their ids returned; when absent, N seeded library
                    cards are returned instead.
                  items:
                    type: object
                    required: [statement]
                    properties:
                      statement: { type: string }
                      rationale: { type: string }
                      model_family: { type: string }
                      features: { type: array, items: { type: string } }
                      expected_outcome: { type: string }
                n:
                  type: integer
                  minimum: 1
                  maximum: 12
                  default: 6
                  description: Number of library cards to return when `hypotheses` is omitted.
      responses:
        "200":
          description: Proposed hypotheses.
          content:
            application/json:
              schema:
                type: object
                required: [hypotheses]
                properties:
                  hypotheses:
                    type: array
                    items: { $ref: "#/components/schemas/Hypothesis" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/approvals/request:
    post:
      tags: [approvals]
      operationId: requestApproval
      summary: Request human approval (request_approval)
      description: >
        Creates a pending approval the cockpit surfaces (e.g. launching N runs at
        an estimated cost, or unbanning a leakage feature). Compute cannot launch
        until a matching approval is recorded via /api/feedback (type=approval).
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Pending approval created.
          content:
            application/json:
              schema:
                type: object
                required: [approval_id, status]
                properties:
                  approval_id: { type: string }
                  status: { type: string, enum: [pending] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/experiments/launch:
    post:
      tags: [experiments]
      operationId: launchExperiment
      summary: Launch a sandboxed experiment (launch_experiment)
      description: >
        Verifies an approval exists, submits the experiment manifest to the Modal
        runner, and records a run with metrics, params, artifacts, and provenance
        (dataset_hash, code_hash, seed). The manifest is the only thing handed to
        the runner — no arbitrary code. Tuning on 'test' is rejected.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { $ref: "#/components/schemas/ExperimentManifest" }
                approval_id:
                  type: string
                  description: The approval authorizing this compute.
                applied_feedback_id:
                  type: string
                  description: Human feedback id whose parsed constraints shaped this run; recorded on the resulting Run.
            examples:
              baseline:
                $ref: "#/components/examples/LaunchBaseline"
      responses:
        "201":
          description: Run created (may still be running).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "402":
          description: No approval on file, or budget exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Manifest invalid (e.g. banned column in features, tune_on=test).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The Modal runner is unreachable or MODAL_RUNNER_URL is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/runs/query:
    post:
      tags: [experiments]
      operationId: queryRuns
      summary: Query runs (query_runs)
      description: >
        Filter the ledger's runs by metric thresholds, model family, hypothesis,
        tags, or linked critique kind. Powers both the cockpit run table and the
        agent's "show me runs where recall improved but precision dropped" queries.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunQuery"
      responses:
        "200":
          description: Matching runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/critiques:
    post:
      tags: [experiments]
      operationId: recordCritique
      summary: Record a critique (record_critique)
      description: >
        Persist a methodological critique of a run — leakage, test-set tuning, metric,
        calibration, or robustness — with a finding, a recommendation, and the decision
        it led to. This is how the experiment-critic writes evidence into the ledger; the
        rubric's "caught an issue" and "leakage review before training" checks read it.
        The id is server-assigned.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [study_id, kind, finding]
              properties:
                study_id: { type: string }
                target_run_id: { type: string }
                kind:
                  type: string
                  enum: [leakage, test_set_tuning, metric, calibration, robustness]
                finding: { type: string }
                recommendation: { type: string }
                led_to_decision:
                  type: string
                  enum: [promote, reject, rerun, branch, stop]
      responses:
        "201":
          description: Critique recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Critique" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/decisions:
    post:
      tags: [experiments]
      operationId: recordDecision
      summary: Record a decision (record_decision)
      description: >
        Persist a decision — promote, reject, rerun, branch, or stop — naming the run it
        acted on and the reason. Every promote/reject in the loop is recorded so the
        ledger captures what the agent (or human) decided and why. The id is server-assigned.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [study_id, action]
              properties:
                study_id: { type: string }
                action:
                  type: string
                  enum: [promote, reject, rerun, branch, stop]
                promoted_run_id: { type: string }
                rejected_run_id: { type: string }
                reason: { type: string }
      responses:
        "201":
          description: Decision recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/feedback:
    post:
      tags: [feedback]
      operationId: recordHumanFeedback
      summary: Record human feedback (record_human_feedback)
      description: >
        Stores a human judgment and (for natural-language notes) its parsed
        constraints. An approval is feedback of type=approval. The ergonomic
        breakthrough: the human gives judgment, the agent gets a structured
        constraint it can apply to later manifests (applied_feedback_id).
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Feedback"
            examples:
              recallOverPrecision:
                $ref: "#/components/examples/FeedbackRecall"
              approval:
                $ref: "#/components/examples/FeedbackApproval"
      responses:
        "201":
          description: Feedback recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feedback" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/reports:
    post:
      tags: [reports]
      operationId: writeReport
      summary: Generate the model card (write_report)
      description: >
        Assembles the final report — objective, data, split, experiments table,
        best vs baseline, risks, rejected ideas, next steps, a reproducible
        command, and a provenance footer — stores it in R2, and records an
        artifact of kind=report.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [study_id]
              properties:
                study_id: { type: string }
                report_type:
                  type: string
                  enum: [model_card, summary]
                  default: model_card
      responses:
        "201":
          description: Report generated and stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/grade:
    post:
      tags: [grading]
      operationId: gradeStudy
      summary: Grade against the rubric (grade_study_against_rubric)
      description: >
        Evaluates the study against docs/rubric.json and returns pass/fail per
        check plus an overall verdict. This is the machine-checkable definition of
        done — the Stop hook calls it so "done" is verifiable without a human.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [study_id]
              properties:
                study_id: { type: string }
      responses:
        "200":
          description: Grading result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GradeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      description: >
        Shared secret (LABMATE_INTERNAL_TOKEN) between the MCP server and the
        Worker. Not the Cloudflare API token. Generate with `openssl rand -hex 24`.

  parameters:
    StudyId:
      name: studyId
      in: path
      required: true
      schema: { type: string }
      example: study_01HZX

  responses:
    BadRequest:
      description: Malformed request body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid internal token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }

    Budget:
      type: object
      properties:
        max_trials: { type: integer, default: 20 }
        budget_seconds: { type: integer, default: 600 }

    Study:
      type: object
      required: [id, brief, dataset_id, target, metric]
      properties:
        id: { type: string }
        brief: { type: string }
        owner: { type: string }
        task_type:
          type: string
          enum: [binary_classification, regression]
        dataset_id: { type: string }
        target: { type: string }
        metric: { type: string }
        metric_rationale: { type: string }
        budget: { $ref: "#/components/schemas/Budget" }
        rubric: { type: string, default: docs/rubric.json }
        status:
          type: string
          enum: [open, running, done, stopped]
          default: open
        constraints:
          $ref: "#/components/schemas/Constraints"
        created_at: { type: string, format: date-time }

    CreateStudyRequest:
      type: object
      required: [brief, dataset_id, target, metric]
      properties:
        brief: { type: string }
        owner: { type: string }
        task_type:
          type: string
          enum: [binary_classification, regression]
        dataset_id: { type: string }
        target: { type: string }
        metric: { type: string }
        metric_rationale: { type: string }
        constraints:
          $ref: "#/components/schemas/Constraints"
        budget: { $ref: "#/components/schemas/Budget" }
        rubric: { type: string, default: docs/rubric.json }

    CreateStudyResponse:
      type: object
      required: [id]
      properties:
        id: { type: string }
        status: { type: string, enum: [open] }

    Constraints:
      type: object
      properties:
        primary_metric: { type: string }
        guardrails:
          type: array
          items:
            type: object
            properties:
              expr: { type: string, examples: ["false_positive_rate <= 0.20"] }
              rationale: { type: string }
        banned_columns:
          type: array
          items: { type: string }
        require_interpretability: { type: boolean, default: false }

    ColumnProfile:
      type: object
      required: [name, dtype]
      properties:
        name: { type: string }
        dtype: { type: string }
        missing_fraction: { type: number, minimum: 0, maximum: 1 }
        n_unique: { type: integer }
        is_candidate_leakage: { type: boolean, default: false }
        leakage_reason: { type: string }

    SplitStrategy:
      type: object
      required: [strategy, seed]
      properties:
        strategy:
          type: string
          enum: [time_based, stratified]
        time_col: { type: string }
        ratios:
          type: array
          items: { type: number }
          minItems: 3
          maxItems: 3
          description: "[train, validation, test]"
        seed: { type: integer }

    DatasetVersion:
      type: object
      required: [id, study_id, file_hash, row_count]
      properties:
        id: { type: string }
        study_id: { type: string }
        file_hash: { type: string }
        row_count: { type: integer }
        columns:
          type: array
          items: { $ref: "#/components/schemas/ColumnProfile" }
        target_definition: { type: string }
        split_strategy: { $ref: "#/components/schemas/SplitStrategy" }
        leakage_candidates:
          type: array
          items: { type: string }
        banned_columns:
          type: array
          items: { type: string }
        dataset_uri:
          type: string
          description: Where the runner pulls the CSV; the agent echoes it onto launch manifests.
        created_at: { type: string, format: date-time }

    ProfileColumn:
      type: object
      description: >
        One profiled column from `profileCsv` (apps/web/src/profiles.js) — a row of
        `DatasetProfile.columns`. Distinct from `ColumnProfile` (the persisted
        dataset_version column shape): this carries the additive real-profiling fields
        the cockpit renders (missing_pct, cardinality, example_values).
      required: [name, dtype, missing_fraction, missing_pct, cardinality, n_unique, example_values, is_candidate_leakage]
      properties:
        name: { type: string }
        dtype:
          type: string
          enum: [numeric, categorical, datetime, boolean, text]
          description: Inferred over the non-blank sample.
        missing_fraction:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction of rows missing this column, rounded to 4 dp.
        missing_pct:
          type: number
          description: "missing_fraction * 100, pre-rounded by the Worker."
        cardinality:
          type: integer
          description: Distinct non-blank values in the sample.
        n_unique:
          type: integer
          description: Same as `cardinality` (kept for parity with ColumnProfile).
        example_values:
          type: array
          items: { type: string }
          description: Up to 5 distinct example values.
        is_candidate_leakage:
          type: boolean
          default: false
          description: Flagged by name pattern OR near-perfect target separation.
        leakage_reason:
          type: string
          description: Present only when `is_candidate_leakage` is true.

    DatasetProfile:
      type: object
      description: >
        The `profile` object returned by `POST /api/datasets` (the `profileCsv` output in
        apps/web/src/profiles.js). It is the real, per-upload profiling result the cockpit
        consumes — a superset of the persisted DatasetVersion contract, plus the additive
        fields (categorical_features, datetime_columns, sampled, per-column example_values).
      required: [dataset_id, row_count, target, leakage_candidates, safe_features, split, columns]
      properties:
        dataset_id: { type: string }
        row_count:
          type: integer
          description: Rows observed in the (possibly sampled) CSV.
        target:
          type: [string, "null"]
          description: The target column name, or null when none was supplied.
        target_definition:
          type: [string, "null"]
          description: A human-authored definition; null for a fresh upload.
        leakage_candidates:
          type: array
          items: { type: string }
        safe_features:
          type: array
          items: { type: string }
        categorical_features:
          type: array
          items: { type: string }
          description: Suggested categoricals (categorical + boolean columns). Omitted on an empty CSV.
        datetime_columns:
          type: array
          items: { type: string }
          description: Detected datetime columns. Omitted on an empty CSV.
        split: { $ref: "#/components/schemas/ProfileSplit" }
        columns:
          type: array
          items: { $ref: "#/components/schemas/ProfileColumn" }
        sampled:
          type: boolean
          description: True when the CSV was truncated to the profiling row cap (5000).

    ProfileSplit:
      type: object
      description: >
        The suggested split `profileCsv` attaches. Unlike SplitStrategy this allows the
        `random` fallback used when no usable creation-time column exists.
      required: [strategy, ratios, seed]
      properties:
        strategy:
          type: string
          enum: [time_based, random]
        time_col:
          type: string
          description: Present only for a time_based split.
        ratios:
          type: array
          items: { type: number }
          minItems: 3
          maxItems: 3
          description: "[train, validation, test]"
        seed: { type: integer, default: 42 }

    Dataset:
      type: object
      description: >
        A row of the `dataset` catalog (apps/web/schema.sql) — an UPLOADED dataset, distinct
        from the per-study DatasetVersion. Records the CSV's content hash and the cached
        `profileCsv` result so a study can attach to it by dataset_id.
      required: [id, created_at]
      properties:
        id:
          type: string
          description: dataset_<ulid> or a caller-supplied, sanitized id.
        source:
          type: string
          enum: [uploaded, bundled]
        content_hash:
          type: string
          description: sha256 of the raw CSV bytes.
        row_count:
          type: integer
          description: Rows observed (sampled, capped).
        target:
          type: [string, "null"]
          description: Optional target hint used for leakage scoring.
        profile:
          allOf:
            - $ref: "#/components/schemas/DatasetProfile"
          description: >
            The cached profileCsv() result (stored as profile_json in D1). Surfaced as a
            structured object here.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Hypothesis:
      type: object
      required: [id, study_id, statement]
      properties:
        id: { type: string }
        study_id: { type: string }
        statement: { type: string, description: "A falsifiable claim." }
        rationale: { type: string }
        model_family: { type: string }
        features:
          type: array
          items: { type: string }
        expected_outcome: { type: string }
        status:
          type: string
          enum: [proposed, approved, tested, rejected]
        created_at: { type: string, format: date-time }

    ModelSpec:
      type: object
      required: [family]
      properties:
        family:
          type: string
          enum:
            - dummy
            - logistic_regression
            - linear_regression
            - random_forest
            - gradient_boosting
            - hist_gradient_boosting
            - xgboost
            - lightgbm
        params: { type: object, additionalProperties: true }

    SearchSpec:
      type: object
      properties:
        enabled: { type: boolean, default: false }
        max_trials: { type: integer, minimum: 1, default: 20 }
        timeout_seconds: { type: integer, minimum: 1, default: 600 }
        sampler: { type: string, default: tpe }
        tune_on:
          type: string
          enum: [validation]
          default: validation
          description: Tuning on 'test' is forbidden and rejected by the runner.

    MetricSpec:
      type: object
      required: [primary]
      properties:
        primary:
          type: string
          examples: [recall_at_fpr, pr_auc, roc_auc, rmse, mae]
        max_fpr:
          type: number
          description: The FPR guardrail bound the runner enforces (e.g. 0.20).
        primary_metric:
          type: string
          description: The primary metric the runner optimizes/reports (e.g. recall).

    ExperimentManifest:
      type: object
      description: >
        An experiment to run in the Modal sandbox. Two mutually exclusive modes
        (script XOR model): supply `script` — an agent-authored Python training
        program the network-isolated Modal Sandbox runs — OR `model` + `metric`
        for the legacy manifest→sklearn path. `study_id`, `hypothesis_id`,
        `dataset_uri`, `target`, `task_type`, `split`, and `features` are required
        in both modes.
      required: [study_id, hypothesis_id, dataset_uri, target, task_type, split, features]
      oneOf:
        - required: [script]
        - required: [model, metric]
      properties:
        study_id: { type: string }
        hypothesis_id: { type: string }
        dataset_uri:
          type: string
          description: Where the runner pulls the CSV (R2 key or public URL).
        target: { type: string }
        task_type:
          type: string
          enum: [binary_classification, regression]
        split: { $ref: "#/components/schemas/SplitStrategy" }
        features:
          type: array
          items: { type: string }
          description: MUST exclude banned/leaky columns.
        banned_columns:
          type: array
          items: { type: string }
        script:
          type: string
          description: >
            Agent-authored, self-contained Python training code. Reads the CSV at
            /work/data.csv, makes the deterministic split FIRST using split.seed,
            trains, tunes on validation only (never test), evaluates on test once,
            and writes /work/result.json := {metrics, params, artifacts}. Runs in a
            network-isolated Modal Sandbox; pandas/numpy/scikit-learn are installed.
            Provided INSTEAD of model/metric (script XOR model).
        tune_on:
          type: string
          enum: [validation]
          default: validation
          description: >
            Where the script tunes thresholds/hyperparameters. Tuning on 'test' is
            forbidden and rejected. Honored on the script path (the legacy path uses
            search.tune_on).
        model: { $ref: "#/components/schemas/ModelSpec" }
        search: { $ref: "#/components/schemas/SearchSpec" }
        metric: { $ref: "#/components/schemas/MetricSpec" }
        applied_feedback_id:
          type: string
          description: Human feedback id whose parsed constraint shaped this manifest.
        tags:
          type: array
          items: { type: string }
          examples: [["baseline"]]

    Run:
      type: object
      required: [id, study_id, hypothesis_id, status]
      properties:
        id: { type: string }
        study_id: { type: string }
        hypothesis_id: { type: string }
        manifest_id: { type: string }
        tracker_run_id: { type: string }
        status:
          type: string
          enum: [queued, running, completed, failed]
        metrics: { type: object, additionalProperties: { type: number } }
        params: { type: object, additionalProperties: true }
        artifacts:
          type: object
          additionalProperties: true
          description: name -> { uri, kind }
        rationale: { type: string, description: "What this run tests and why." }
        applied_feedback_id:
          type: string
          description: Human feedback id whose parsed constraints shaped this run.
        tags:
          type: array
          items: { type: string }
        executor:
          type: string
          const: modal-runner
        dataset_hash: { type: string }
        code_hash: { type: string }
        seed: { type: integer }
        created_at: { type: string, format: date-time }

    Critique:
      type: object
      required: [id, study_id, kind, finding]
      properties:
        id: { type: string }
        study_id: { type: string }
        target_run_id: { type: string }
        kind:
          type: string
          enum: [leakage, test_set_tuning, metric, calibration, robustness]
        finding: { type: string }
        recommendation: { type: string }
        led_to_decision:
          type: string
          enum: [promote, reject, rerun, branch, stop]
        created_at: { type: string, format: date-time }

    Decision:
      type: object
      required: [id, study_id, action]
      properties:
        id: { type: string }
        study_id: { type: string }
        action:
          type: string
          enum: [promote, reject, rerun, branch, stop]
        promoted_run_id: { type: string }
        rejected_run_id: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    Feedback:
      type: object
      required: [study_id, type, content]
      properties:
        id: { type: string }
        study_id: { type: string }
        target_id: { type: string }
        type:
          type: string
          enum: [approval, ban_feature, change_metric, increase_budget, focus_segment, note, human_feedback]
        scope: { type: string, enum: [study, hypothesis, run, experiment] }
        content: { type: string }
        parsed_constraints:
          type: object
          additionalProperties: true
          description: "e.g. { primary_metric: 'recall', guardrail: 'false_positive_rate <= 0.20' }"
        created_at: { type: string, format: date-time }

    ApprovalRequest:
      type: object
      required: [study_id, reason]
      properties:
        study_id: { type: string }
        experiment_ids:
          type: array
          items: { type: string }
        reason: { type: string }
        estimated_cost_seconds: { type: integer }

    Artifact:
      type: object
      required: [id, study_id, kind, uri]
      properties:
        id: { type: string }
        study_id: { type: string }
        kind: { type: string, enum: [report, plot, model, confusion_matrix] }
        uri: { type: string }
        dataset_hash: { type: string }
        code_hash: { type: string }
        seed: { type: integer }
        meta:
          type: object
          description: >
            Free-form artifact metadata. For a report artifact this carries the
            model-card provenance fields below.
          additionalProperties: true
          properties:
            best_run_id: { type: string, description: Run with the best validation metric. }
            promoted_run_id: { type: string, description: The run a decision promoted (may differ from best). }
            baseline_run_id: { type: string, description: The baseline the report compares the best/promoted run to. }
            compares_best_to_baseline: { type: boolean }
            reproducible_command: { type: string }
            report_type: { type: string, enum: [model_card, summary] }
        created_at: { type: string, format: date-time }

    Report:
      type: object
      required: [study_id, uri]
      properties:
        study_id: { type: string }
        uri: { type: string, description: R2 location of the rendered report. }
        markdown: { type: string, description: The rendered model-card markdown (present on write_report and GET report). }
        generated_at: { type: string, format: date-time }
        best_run_id: { type: string }
        baseline_run_id: { type: string }
        compares_best_to_baseline: { type: boolean }
        reproducible_command: { type: string }
        provenance:
          type: object
          properties:
            dataset_hash: { type: string }
            code_hash: { type: string }
            seed: { type: integer }

    RunQuery:
      type: object
      required: [study_id]
      properties:
        study_id: { type: string }
        model_family: { type: string }
        hypothesis_id: { type: string }
        tags:
          type: array
          items: { type: string }
        critique_kind:
          type: string
          enum: [leakage, test_set_tuning, metric, calibration, robustness]
        metric_filters:
          type: array
          description: e.g. recall >= 0.7 AND precision < 0.5
          items:
            type: object
            required: [name, op, value]
            properties:
              name: { type: string }
              op: { type: string, enum: ["<", "<=", "=", ">=", ">"] }
              value: { type: number }

    StudyDetail:
      type: object
      required: [study]
      description: The whole evidence ledger in one payload (cockpit + grader read this).
      properties:
        study: { $ref: "#/components/schemas/Study" }
        dataset_version: { $ref: "#/components/schemas/DatasetVersion" }
        hypotheses:
          type: array
          items: { $ref: "#/components/schemas/Hypothesis" }
        runs:
          type: array
          items: { $ref: "#/components/schemas/Run" }
        critiques:
          type: array
          items: { $ref: "#/components/schemas/Critique" }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/Decision" }
        feedback:
          type: array
          items: { $ref: "#/components/schemas/Feedback" }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
        recommendation:
          type: string
          description: Current agent recommendation rendered in the cockpit.

    GradeResult:
      type: object
      required: [study_id, verdict, checks]
      properties:
        study_id: { type: string }
        rubric_name: { type: string }
        rubric_version: { type: integer }
        verdict:
          type: string
          enum: [done, not_done]
        passed_required: { type: integer }
        total_required: { type: integer }
        checks:
          type: array
          items:
            type: object
            required: [id, required, passed]
            properties:
              id: { type: string }
              category: { type: string }
              required: { type: boolean }
              passed: { type: boolean }
              detail: { type: string }

  examples:
    CreateStudySlaTickets:
      summary: SLA-breach study on the bundled dataset
      value:
        brief: >
          Predict which support tickets will breach SLA. Optimize recall at an
          acceptable false-positive cost. Do not use fields created after ticket
          close.
        owner: team@example.com
        task_type: binary_classification
        dataset_id: sla_tickets
        target: breached_sla
        metric: recall_at_fpr
        metric_rationale: Missed breaches are costlier than false alarms up to 20% FPR.
        constraints:
          primary_metric: recall
          guardrails:
            - expr: "false_positive_rate <= 0.20"
          banned_columns: [resolved_at, time_to_resolution, closed_status, agent_notes_final]
        budget:
          max_trials: 20
          budget_seconds: 600

    LaunchBaseline:
      summary: A baseline logistic-regression run
      value:
        approval_id: appr_01HZX
        manifest:
          study_id: study_01HZX
          hypothesis_id: hyp_baseline
          dataset_uri: studies/study_01HZX/data.csv
          target: breached_sla
          task_type: binary_classification
          split:
            strategy: time_based
            time_col: created_at
            ratios: [0.7, 0.15, 0.15]
            seed: 42
          features: [priority, customer_tier, channel, product_area, region, reporter_history_count, queue_depth_at_creation, is_reopen, description_length, business_hours_flag]
          banned_columns: [resolved_at, time_to_resolution, closed_status, agent_notes_final]
          model:
            family: logistic_regression
          metric:
            primary: recall_at_fpr
            max_fpr: 0.20
          tags: [baseline]

    FeedbackRecall:
      summary: Natural-language judgment parsed into a constraint
      value:
        study_id: study_01HZX
        type: note
        scope: study
        content: >
          Recall matters more than precision, but false positives above 20% are
          not acceptable.
        parsed_constraints:
          primary_metric: recall
          guardrail: "false_positive_rate <= 0.20"

    FeedbackApproval:
      summary: Approving a batch of runs
      value:
        study_id: study_01HZX
        type: approval
        scope: study
        content: Approved 8 experiments, 10-minute budget.
