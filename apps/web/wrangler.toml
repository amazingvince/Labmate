name = "labmate"
main = "src/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "f7759969c2ba490558d2bcd889d54d5d"

# Custom domains for the deployed app. The same Worker serves the cockpit SPA
# (via [assets] below) AND the /api control plane on BOTH hostnames; the SPA is
# same-origin so it calls /api on whichever domain it loaded from. Both domains
# are listed so a deploy never prunes one. `wrangler deploy` auto-provisions the
# DNS record + TLS cert. Ignored by `wrangler dev` (local).
routes = [
  # Apex is a zone route over an existing (externally-managed) DNS record — NOT a
  # custom_domain (declaring it custom_domain makes wrangler try to manage DNS and
  # fail against the existing record). zone route just binds the Worker; DNS stays.
  { pattern = "amazingvince.com/*", zone_name = "amazingvince.com" },
  { pattern = "labmate.amazingvince.com", custom_domain = true },
]

# Cockpit SPA served as Workers Static Assets. `npm run build` (apps/cockpit)
# emits ../cockpit/dist; assets are served first and /api/* + unmatched paths
# fall through to the Worker (src/worker.js). Build the cockpit before deploying.
[assets]
directory = "../cockpit/dist"

# schema.sql is imported as a Text module so the Worker can self-apply the ledger
# schema on first request (in addition to `wrangler d1 execute --file=./schema.sql`).
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# ---- D1 (studies, hypotheses, runs, feedback, critiques, decisions, artifacts) ----
# Create with: npx wrangler d1 create labmate
# then paste the printed database_id here AND into .env (CLOUDFLARE_D1_DATABASE_ID).
# The placeholder below is fine for `wrangler dev` (local mode keys storage by binding).
[[d1_databases]]
binding = "DB"
database_name = "labmate"
database_id = "f4c799bd-3008-485f-a94a-e47465d43dd7"

# ---- R2 (artifacts, reports, model files) ----
# Create with: npx wrangler r2 bucket create labmate-artifacts
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "labmate-artifacts"

# ---- Durable Object (live study state / event stream for the cockpit) ----
[[durable_objects.bindings]]
name = "STUDY"
class_name = "StudySession"

[[migrations]]
tag = "v1"
new_classes = ["StudySession"]

# ---- Vars / secrets ----
# LABMATE_INTERNAL_TOKEN is a secret: set with `npx wrangler secret put LABMATE_INTERNAL_TOKEN`
# (or apps/web/.dev.vars locally). MODAL_RUNNER_URL is the deployed runner endpoint.
[vars]
LABMATE_ENV = "dev"
MODAL_RUNNER_URL = "https://amazingvince--labmate-runner-launch.modal.run"
# Agent runtime base URL (apps/agent-runtime). When set, POST /api/studies kicks a
# Managed Agents session and GET /api/studies/{id}/stream proxies its SSE. Empty by
# default so the contract test runs without a runtime; set locally in .dev.vars.
AGENT_RUNTIME_URL = "https://amazingvince--labmate-agent-runtime-agent-runtime.modal.run"
# Base the Modal runner reads study CSVs from (R2/HTTPS). dataset_uri on a manifest
# resolves to "{LABMATE_DATASET_BASE}/{dataset_id}.csv". Empty → relative key.
LABMATE_DATASET_BASE = "https://labmate.amazingvince.com/data"
